name: Check Career Desk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --include=optional --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run build
